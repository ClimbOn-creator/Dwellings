name: dwelling_iq
description: Transparent housing investment and homebuyer decision intelligence.
publish_to: none
version: 0.3.0+9

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  file_picker: ^10.3.10
  google_fonts: ^6.2.1
  geolocator: ^14.0.2
  http: ^1.6.0
  image_picker: ^1.2.1
  intl: ^0.20.2
  shared_preferences: ^2.5.4
  supabase_flutter: ^2.10.3
  url_launcher: ^6.3.2
  web: ^1.1.1
  flutter_svg: ^2.3.0
  flutter_secure_storage: 10.3.4
  firebase_core: 5.0.0
  firebase_messaging: 17.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  fonts:
    - family: PactInter
      fonts:
        - asset: assets/fonts/Inter.ttf
          weight: 400
        - asset: assets/fonts/Inter.ttf
          weight: 500
        - asset: assets/fonts/Inter.ttf
          weight: 600
        - asset: assets/fonts/Inter.ttf
          weight: 700
  assets:
    - assets/fonts/OFL.txt
    - assets/product_tours/
    - assets/images/
    - assets/brand/
    - assets/resource_logos/
    - assets/transaction_templates/
    - assets/transaction_previews/
